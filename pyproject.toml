[project]
name = "conveyor-verify"
version = "0.1.0"
description = "Offline verifier for Conveyor integrity logs and evidence bundles"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "pynacl>=1.5", "rfc8785>=0.1.4"]

[project.scripts]
conveyor-verify = "conveyor_verify.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conveyor_verify"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rfc8785", "nacl.*"]
ignore_missing_imports = true
